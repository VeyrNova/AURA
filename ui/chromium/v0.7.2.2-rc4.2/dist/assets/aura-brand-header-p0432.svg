<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Aura logo">
  <defs>
    <linearGradient id="hCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF7FF"/>
      <stop offset=".38" stop-color="#54D9FF"/>
      <stop offset="1" stop-color="#427BFF"/>
    </linearGradient>
    <linearGradient id="hViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#D84CFF"/>
    </linearGradient>
    <linearGradient id="hCore" x1=".18" y1=".15" x2=".82" y2=".85">
      <stop offset="0" stop-color="#EAF7FF"/>
      <stop offset=".28" stop-color="#54D9FF"/>
      <stop offset=".62" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#D84CFF"/>
    </linearGradient>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="45.5" fill="none" stroke="#54D9FF" stroke-opacity=".52" stroke-width="2"/>
  <circle cx="60" cy="60" r="43" fill="none" stroke="#8B5CFF" stroke-opacity=".12" stroke-width=".8"/>

  <g fill="none" stroke-linecap="round" filter="url(#hGlow)">
    <path d="M60 60 L28 60" stroke="url(#hCyan)" stroke-width="4.6"/>
    <path d="M60 60 L43 30" stroke="url(#hCyan)" stroke-width="4.6"/>
    <path d="M60 60 L77 30" stroke="url(#hCyan)" stroke-width="4.6"/>
    <path d="M60 60 L92 60" stroke="url(#hViolet)" stroke-width="4.6"/>
    <path d="M60 60 L43 90" stroke="url(#hViolet)" stroke-width="4.6"/>
    <path d="M60 60 L77 90" stroke="url(#hViolet)" stroke-width="4.6"/>
  </g>

  <polygon points="60,48 70.4,54 70.4,66 60,72 49.6,66 49.6,54"
    fill="url(#hCore)" stroke="#EAF7FF" stroke-opacity=".28" stroke-width="1"/>
  <circle cx="60" cy="60" r="4.2" fill="#EAF7FF" stroke="#54D9FF" stroke-width="1"/>
</svg>
