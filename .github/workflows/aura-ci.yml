name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-gate:
    name: Public repository gate
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate public AURA distribution
        shell: pwsh
        run: python ci/public_fast_lane.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-public-ci-report
          path: ci/reports/public_fast_lane.json
          if-no-files-found: error
