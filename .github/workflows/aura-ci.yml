name: AURA CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  fast-lane:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Minimal CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv requests
      - name: AURA Fast Lane
        shell: pwsh
        run: python ci/fast_lane.py --portable
      - name: Validate v0.8.6.2 lock schema/platform
        shell: pwsh
        run: python environment/verify_environment.py --portable
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-fast-lane-reports
          path: ci/reports/*.json
          if-no-files-found: ignore

  full-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Minimal smoke dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv requests
      - name: AURA Full Lane smoke
        shell: pwsh
        run: python ci/full_lane.py --mode smoke
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-full-smoke-reports
          path: ci/reports/*.json
          if-no-files-found: ignore
