name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-gate:
    name: Public repository gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate public AURA distribution
        shell: pwsh
        run: python ci/public_fast_lane.py

      - name: Validate internal import closure
        shell: pwsh
        run: python ci/repository_integrity_gate.py

      - name: Validate production source portability
        shell: pwsh
        run: python ci/portability_gate.py

      - name: Upload public validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aura-public-ci-report
          path: ci/reports/public_fast_lane.json
          if-no-files-found: error

  dependency-gate:
    name: Reproducible dependency gate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate dependency lock contract
        shell: pwsh
        run: python environment/verify_environment.py --portable

      - name: Verify clean core installation
        shell: pwsh
        run: python environment/cold_install_verifier.py --profile core --network --no-cache

      - name: Upload dependency validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aura-dependency-ci-reports
          path: |
            ci/reports/environment_v0862_result.json
            ci/reports/cold_install_core_result.json
          if-no-files-found: warn

  boot-smoke:
    name: Clean checkout boot smoke
    needs: [public-gate, dependency-gate]
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create AURA project venv
        shell: pwsh
        run: python -m venv venv

      - name: Install certified core dependencies
        shell: pwsh
        run: .\venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Validate RUN_AURA bootstrap chain
        shell: cmd
        run: RUN_AURA.bat --self-check

      - name: Validate checkout path and embedded UI resolution
        shell: pwsh
        run: .\venv\Scripts\python.exe ci\boot_smoke.py

      - name: Upload boot smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aura-boot-smoke-report
          path: ci/reports/boot_smoke_result.json
          if-no-files-found: warn

